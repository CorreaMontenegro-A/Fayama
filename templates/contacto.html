{% extends "base.html" %}

{% block content %}
<section class="contact-hero py-5">
    <div class="container">
        <h1 class="display-4 text-center mb-5 animate__animated animate__fadeIn">Contacta con Nosotros</h1>
        <div class="row">
            <div class="col-lg-6">
                <div class="contact-info animate__animated animate__fadeInLeft">
                    <h3>Información de Contacto</h3>
                    <div class="contact-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <p>Calle Principal, 123<br>Málaga, España</p>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-phone"></i>
                        <p>+34 123 456 789</p>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <p>info@domoticamalaga.com</p>
                    </div>
                    <div class="social-links mt-4">
                        <a href="#" class="social-icon"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="social-icon"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="contact-form animate__animated animate__fadeInRight">
                    <h3>Envíanos un Mensaje</h3>
                    <form id="contactForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Nombre" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <input type="tel" class="form-control" placeholder="Teléfono">
                        </div>
                        <div class="mb-3">
                            <select class="form-control" required>
                                <option value="">Selecciona un servicio</option>
                                <option value="iluminacion">Iluminación Inteligente</option>
                                <option value="seguridad">Seguridad</option>
                                <option value="climatizacion">Climatización</option>
                                <option value="entretenimiento">Entretenimiento</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" rows="5" placeholder="Mensaje" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="map-section py-5">
    <div class="container">
        <div class="map-container animate__animated animate__fadeIn">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3197.604061093977!2d-4.420767684319336!3d36.72019697996258!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd72f7c8d4b0b0b9%3A0x8c3b3b3b3b3b3b3b!2sM%C3%A1laga!5e0!3m2!1ses!2ses!4v1620000000000!5m2!1ses!2ses" 
                    width="100%" 
                    height="450" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy">
            </iframe>
        </div>
    </div>
</section>
{% endblock %}
